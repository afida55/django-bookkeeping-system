<!DOCTYPE html>
<html>
<head>
    <title>Bookkeeping System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* BACKGROUND - Same as Login Page */
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #172554, #0c0a09);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            position: relative;
            color: white;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(167, 139, 250, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientMove {
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }

        /* NAVBAR - Glassmorphism Style */
        .navbar {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 0;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.5px;
            color: #ffffff !important;
        }

        .nav-link {
            color: #94a3b8 !important;
            font-weight: 500;
            font-size: 15px;
            padding: 10px 18px !important;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin: 0 2px;
        }

        .nav-link:hover {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: #ffffff !important;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        /* Logout link - Red tint */
        .navbar-nav .nav-link:last-child {
            color: #fca5a5 !important;
        }

        .navbar-nav .nav-link:last-child:hover {
            color: #ffffff !important;
            background: rgba(239, 68, 68, 0.15);
        }

        /* CONTENT CONTAINER */
        .container {
            position: relative;
            z-index: 1;
        }

        /* Make Bootstrap text visible on dark background */
        .container h1,
        .container h2,
        .container h3,
        .container h4,
        .container h5,
        .container h6,
        .container p,
        .container span,
        .container label,
        .container div {
            color: white;
        }

        /* Make Bootstrap tables look good on dark background */
        .table {
            color: rgba(255, 255, 255, 0.85) !important;
        }

        .table thead th {
            color: white !important;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .table td, .table th {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.85);
        }

        .table-bordered > :not(caption) > * {
            border-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand" href="/statistics/">
            Bookkeeping System
        </a>

        <div class="navbar-nav">

            <a class="nav-link {% if request.path == '/statistics/' %}active{% endif %}"
               href="/statistics/">
                Dashboard
            </a>

            <a class="nav-link {% if request.path == '/records/' %}active{% endif %}"
               href="/records/">
                Records
            </a>

            <a class="nav-link {% if request.path == '/category/' %}active{% endif %}"
               href="/category/">
                Categories
            </a>

            <a class="nav-link {% if request.path == '/profile/' or request.path == '/profile/edit/' %}active{% endif %}"
               href="/profile/">
                Profile
            </a>

            <a class="nav-link" href="/logout/">
                Logout
            </a>

        </div>

    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
